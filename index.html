<style>

/* ===== UR AI AI - PREMIUM BLACK MINIMAL REDESIGN ===== */

:root {
    color-scheme: dark;
    --bg: #090909;
    --sidebar: #050505;
    --panel: #171717;
    --text: #f5f5f5;
    --muted: #929292;
    --border: #292929;
    --accent: #ffffff;
}

/* Overall appearance */
body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    letter-spacing: -0.15px;
}

/* Sidebar */
.sidebar {
    background: var(--sidebar);
    border-right: 1px solid #202020;
    padding: 18px 13px;
    gap: 15px;
}

.brand {
    font-size: 19px;

}

}

.profile {
    color: #aaa;
}

/* Welcome screen */

    max-width: 700px;
    margin-top: 16vh;
}

.welcome h1 {

}

.welcome p {

/* Chat messages */

}

.sender {

.msg.user .msg-content {

/* Composer */

}

.composer {

/* Scrollbars */

    --bg: #212121;

        </button>

        <div class="sidebar-bottom">
           Ur PN AI<br>
Ur PN AI Assistant
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px">
                <button class="mobile-menu" id="menuBtn">☰</button>
               <div class="top-title">Ur PN AI</div>
            </div>

                <span>AI Assistant</span>
               <img src="logo.jpg" alt="Ur PN AI Logo">

<script>
const chatScroll = document.getElementById("chatScroll");
const messagesEl = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const stopBtn = document.getElementById("stopBtn");
const historyList = document.getElementById("historyList");
const sidebar = document.getElementById("sidebar");
const fileInput = document.getElementById("fileInput");
const attachBtn = document.getElementById("attachBtn");
const micBtn = document.getElementById("micBtn");
const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;
} else {
    micBtn.disabled = true;
    micBtn.title = "Voice input is not supported in this browser";
}
if (recognition) {
    micBtn.addEventListener("click", () => {
        recognition.start();
        micBtn.textContent = "🔴";
    });

    recognition.onresult = (event) => {
        input.value = event.results[0][0].transcript;
        input.focus();
        micBtn.textContent = "🎙️";
    };

    recognition.onerror = () => {
        micBtn.textContent = "🎙️";
    };

    recognition.onend = () => {
        micBtn.textContent = "🎙️";
    };
}
const filePreview = document.getElementById("filePreview");

let selectedFiles = [];
let chats = [];
let currentChat = null;
let activeController = null;

try {
    chats = JSON.parse(localStorage.getItem("urPrinceChats") || "[]");
    if (!Array.isArray(chats)) chats = [];
} catch {
    chats = [];
}

function saveChats() {
    localStorage.setItem("urPrinceChats", JSON.stringify(chats));
}

function makeChat() {
    currentChat = {
        id: Date.now(),
        title: "New chat",
        turns: []
    };

    chats.unshift(currentChat);
    saveChats();
    renderHistory();
    renderChat();
    input.focus();
    sidebar.classList.remove("open");
}

function renderHistory() {
    historyList.innerHTML = "";

    chats.forEach(chat => {
        const row = document.createElement("div");
        row.className = "history-row";

        const button = document.createElement("button");
        button.className = "history-item" +
            (currentChat === chat ? " active" : "");
        button.textContent = chat.title || "New chat";
        button.title = chat.title || "New chat";

        button.onclick = () => {
            currentChat = chat;
            renderHistory();
            renderChat();
            sidebar.classList.remove("open");
        };

        const rename = document.createElement("button");
        rename.className = "rename-chat-btn";
        rename.textContent = "✎";
        rename.title = "Rename chat";

        rename.onclick = () => {
            const name = prompt(
                "Enter new chat name:",
                chat.title || "New chat"
            );

            if (name === null) return;

            const cleanName = name.trim();

            if (!cleanName) {
                alert("Chat name cannot be empty.");
                return;
            }

            chat.title = cleanName.slice(0, 60);
            saveChats();
            renderHistory();
        };

        const remove = document.createElement("button");
        remove.className = "rename-chat-btn";
        remove.textContent = "×";
        remove.title = "Delete chat";

        remove.onclick = () => {
            if (!confirm("Delete this chat?")) return;

            chats = chats.filter(item => item.id !== chat.id);

            if (currentChat === chat) {
                currentChat = chats[0] || null;
            }

            saveChats();
            renderHistory();
            renderChat();
        };

        row.append(button, rename, remove);
        historyList.appendChild(row);
    });
}

/* SAFE MARKDOWN RENDERING */
function formatAIMessage(text) {
    if (!window.marked || !window.DOMPurify) return null;

    const html = marked.parse(text, {
        breaks: true,
        gfm: true
    });

    return DOMPurify.sanitize(html);
}

function renderMath(element) {
    if (!window.renderMathInElement) return;

    renderMathInElement(element, {
        delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "$", right: "$", display: false }
        ],
        throwOnError: false,
        ignoredTags: [
            "script", "noscript", "style",
            "textarea", "pre", "code"
        ]
    });
}
function addMessage(
    text,
    who,
    isError = false,
    prompt = null,
    chat = null,
    botTurn = null
) {
    const row = document.createElement("div");
    row.className = "msg " + who;

    if (isError) row.classList.add("error");

    const sender = document.createElement("div");
    sender.className = "sender";
   sender.textContent = who === "user" ? "YOU" : "UR PN AI";

    const content = document.createElement("div");
    content.className = "msg-content";

    if (who === "bot" && !isError) {
        const formatted = formatAIMessage(text);

        if (formatted !== null) {
            content.innerHTML = formatted;
            renderMath(content);
        } else {
            content.textContent = text;
        }
    } else {
        content.textContent = text;
    }

    row.append(sender, content);
    messagesEl.appendChild(row);

    if (who === "bot" && !isError) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const copy = document.createElement("button");
        copy.className = "copy-btn";
        copy.textContent = "Copy";

        copy.onclick = async () => {
            try {
                await navigator.clipboard.writeText(text);
                copy.textContent = "Copied!";
                setTimeout(() => copy.textContent = "Copy", 1500);
            } catch {
                copy.textContent = "Copy unavailable";
            }
        };

        actions.appendChild(copy);

        if (prompt && chat && botTurn) {
            const regenerate = document.createElement("button");
            regenerate.className = "copy-btn";
            regenerate.textContent = "↻ Regenerate";

            regenerate.onclick = () => {
                regenerateResponse(prompt, chat, botTurn);
            };

            actions.appendChild(regenerate);
        }

        content.appendChild(actions);
    }

    chatScroll.scrollTop = chatScroll.scrollHeight;
    return row;
}

function renderChat() {
    messagesEl.innerHTML = "";

    welcome.style.display =
        currentChat && currentChat.turns.length
            ? "none"
            : "block";

    if (!currentChat) return;

    currentChat.turns.forEach((turn, index) => {
        let prompt = null;
        let botTurn = null;

        if (
            turn.who === "bot" &&
            index > 0 &&
            currentChat.turns[index - 1].who === "user"
        ) {
            prompt = currentChat.turns[index - 1].text;
            botTurn = turn;
        }

        addMessage(
            turn.text,
            turn.who,
            false,
            prompt,
            currentChat,
            botTurn
        );
    });

    chatScroll.scrollTop = chatScroll.scrollHeight;
}

function renderTyping() {
    const row = document.createElement("div");
    row.className = "msg bot";
    row.id = "typing";

    const sender = document.createElement("div");
    sender.className = "sender";
  sender.textContent = "UR PN AI";

    const dots = document.createElement("div");
    dots.className = "typing";

    for (let i = 0; i < 3; i++) {
        const dot = document.createElement("span");
        dots.appendChild(dot);
    }

    row.append(sender, dots);
    messagesEl.appendChild(row);

    chatScroll.scrollTop = chatScroll.scrollHeight;
    return row;
}

function stopGeneration() {
    if (activeController) {
        activeController.abort();
    }
}


async function requestAI(message, files = [], history = []) {
    const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message,
            files,
            history
        }),
        signal: activeController.signal
    });

    const raw = await response.text();

    let data;

    try {
        data = JSON.parse(raw);
    } catch {
        throw new Error("Server returned an invalid response.");
    }

    if (!response.ok) {
        throw new Error(
            typeof data.error === "string"
                ? data.error
                : "AI request failed."
        );
    }

    if (!data.reply) {
        throw new Error("AI returned an empty reply.");
    }

    return data.reply;
}

/* REGENERATE */
async function regenerateResponse(prompt, chat, botTurn) {
    if (activeController) return;

    const controller = new AbortController();
    activeController = controller;

    sendBtn.style.display = "none";
    stopBtn.style.display = "block";

    const messageRow = renderTyping();

    try {
        const timeout = setTimeout(
            () => controller.abort(),
            90000
        );

        const reply = await requestAI(prompt);
        clearTimeout(timeout);

        botTurn.text = reply;
        saveChats();

        if (currentChat === chat) {
            renderChat();
        }

    } catch (error) {
        messageRow.remove();

        if (error.name !== "AbortError" && currentChat === chat) {
            addMessage(
                "Regenerate Error: " + error.message,
                "bot",
                true
            );
        }

    } finally {
        if (activeController === controller) {
            activeController = null;
            sendBtn.style.display = "block";
            stopBtn.style.display = "none";
        }
    }
}

/* SEND MESSAGE */
async function sendMessage() {
    let message = input.value.trim();

    if ((!message && !selectedFiles.length) || activeController) {
        return;
    }

    if (!message) {
        message = "Please analyze the attached file(s).";
    }

    if (!currentChat) {
        makeChat();
    }

    const chatForRequest = currentChat;

    chatForRequest.turns.push({
        who: "user",
        text: message
    });

    if (chatForRequest.turns.length === 1) {
        chatForRequest.title = message.slice(0, 36);
    }

    saveChats();
    renderHistory();

    welcome.style.display = "none";
    addMessage(message, "user");

    input.value = "";
    input.style.height = "auto";

    const filesForRequest = selectedFiles.slice();
    selectedFiles = [];
    renderFilePreview();

    const controller = new AbortController();
    activeController = controller;

    sendBtn.style.display = "none";
    stopBtn.style.display = "block";

    const typing = renderTyping();
    const timeout = setTimeout(
        () => controller.abort(),
        90000
    );

    try {
       const history = chatForRequest.turns
    .slice(0, -1)
    .slice(-20)
    .map(turn => ({
        role: turn.who === "user" ? "user" : "model",
        content: turn.text
    }));

const reply = await requestAI(
    message,
    filesForRequest,
    history
);

        typing.remove();

        const botTurn = {
            who: "bot",
            text: reply
        };

        chatForRequest.turns.push(botTurn);
        saveChats();

        if (currentChat === chatForRequest) {
            addMessage(
                reply,
                "bot",
                false,
                message,
                chatForRequest,
                botTurn
            );
        }

    } catch (error) {
        typing.remove();

        if (error.name === "AbortError") {
            const stopped = {
                who: "bot",
                text: "Generation stopped."
            };

            chatForRequest.turns.push(stopped);
            saveChats();

            if (currentChat === chatForRequest) {
                addMessage(stopped.text, "bot");
            }

        } else {
            if (currentChat === chatForRequest) {
                addMessage(
                    "Error: " + error.message,
                    "bot",
                    true
                );
            }
        }

    } finally {
        clearTimeout(timeout);

        if (activeController === controller) {
            activeController = null;
            sendBtn.style.display = "block";
            stopBtn.style.display = "none";
        }

        input.focus();
    }
}

/* FILE ATTACHMENTS */
function renderFilePreview() {
    filePreview.innerHTML = "";

    selectedFiles.forEach((file, index) => {
        const chip = document.createElement("div");
        chip.className = "file-chip";

        const label = document.createElement("span");
        label.textContent = file.name;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.title = "Remove file";

        remove.onclick = () => {
            selectedFiles.splice(index, 1);
            renderFilePreview();
        };

        chip.append(label, remove);
        filePreview.appendChild(chip);
    });
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
            const result = String(reader.result || "");

            resolve({
                name: file.name,
                mimeType: file.type,
                data: result.split(",")[1]
            });
        };

        reader.onerror = () => {
            reject(new Error("Could not read " + file.name));
        };

        reader.readAsDataURL(file);
    });
}

attachBtn.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", async () => {
    const incoming = Array.from(fileInput.files || []);
    fileInput.value = "";

    for (const file of incoming) {
        const allowed = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif",
            "application/pdf"
        ];

        if (!allowed.includes(file.type)) {
            alert(file.name + " is not supported.");
            continue;
        }

        if (file.size > 5 * 1024 * 1024) {
            alert(file.name + " is larger than 5 MB.");
            continue;
        }

        if (selectedFiles.length >= 3) {
            alert("You can attach up to 3 files.");
            break;
        }

        try {
            const encoded = await fileToBase64(file);
            selectedFiles.push(encoded);
        } catch (error) {
            alert(error.message);
        }
    }

    renderFilePreview();
});

/* EVENT LISTENERS */
document.getElementById("newChatBtn")
    .addEventListener("click", makeChat);

document.getElementById("menuBtn")
    .addEventListener("click", () => {
        sidebar.classList.toggle("open");
    });

sendBtn.addEventListener("click", sendMessage);
stopBtn.addEventListener("click", stopGeneration);

input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height =
        Math.min(input.scrollHeight, 160) + "px";
});

/* INITIAL LOAD */
renderHistory();

if (chats.length) {
    currentChat = chats[0];
    renderChat();
} else {
    welcome.style.display = "block";
}

    navigator.serviceWorker.register("/service-worker.js")

      .catch(error => console.error("Service Worker Error:", error));
  });
}
